name: CI

# Vercel already runs `next build` on every push (preview + prod deploys).
# This workflow is intentionally slim — it runs only the checks Vercel
# doesn't, so PRs fail fast on typing errors without burning a deploy slot.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript + lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - run: yarn install --frozen-lockfile

      - run: yarn typecheck

      - run: yarn lint
        continue-on-error: true
