name: CI

# Vercel runs `next build` on every push via the GitHub integration if it's
# wired up, but ours isn't — we deploy from CI instead. The pipeline:
#   1. test   — typecheck + lint + Jest (every PR and push)
#   2. deploy — Vercel production deploy (push to main, after test passes)
#   3. e2e    — Playwright smoke against the just-deployed URL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + Lint + Jest
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - run: yarn install --frozen-lockfile

      - name: TypeScript
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Jest
        run: yarn test --ci

  deploy:
    name: Vercel production deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifact to production
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "## :rocket: Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Playwright (against fresh deploy)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - run: yarn install --frozen-lockfile

      # Cache the Chromium binary keyed on the resolved Playwright version so
      # subsequent runs skip the ~150 MB download entirely.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      # ubuntu-latest already ships every shared lib Chromium needs, so we
      # avoid `--with-deps`. The previous flag triggered an apt-get update path
      # that hung this job for 9+ minutes on a flaky Azure Ubuntu mirror.
      - name: Install Chromium (cache miss only)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: yarn playwright install chromium
        timeout-minutes: 3

      - name: Run E2E smoke against the fresh deploy
        run: yarn test:e2e
        timeout-minutes: 3
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.url || 'https://ttb-label-verifier-gmzkuibjk-skyv0s-projects.vercel.app' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
