name: CI

# Vercel runs `next build` on every push. This workflow runs the checks
# Vercel doesn't — typecheck, lint, Jest, and (on main only) Playwright E2E
# against the deployed URL.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + Lint + Jest
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - run: yarn install --frozen-lockfile

      - name: TypeScript
        run: yarn typecheck

      - name: Lint
        run: yarn lint
        continue-on-error: true

      - name: Jest
        run: yarn test --ci

  e2e:
    name: Playwright (production smoke)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: yarn test:e2e:install

      - name: Run E2E smoke
        run: yarn test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || 'https://ttb-label-verifier-a9t0bphlx-skyler8icloudcoms-projects.vercel.app' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
